version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: selfmanual_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: selfmanual_api
    restart: always
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  bot:
    build: .
    container_name: selfmanual_bot
    restart: always
    command: python run_bot.py
    env_file:
      - .env
    depends_on:
      - redis
      - api
